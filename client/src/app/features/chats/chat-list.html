<aside class="sidebar">
  <!-- Logo -->
  <div class="sidebar__logo">
    <!-- <div class="sidebar__logo-mark">NB</div> -->
    <div>
      <div class="sidebar__logo-name">WhatTheMessenger</div>
      <div class="sidebar__logo-sub">CHATS</div>
    </div>
  </div>

  <!-- Nav -->
  <nav class="sidebar__nav">

    @for (chat of userChats(); track chat.id) {
      <a class="nav-item" routerLinkActive="active" [routerLink]="['/chats', chat.id]">
        <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
        <span class="nav-item__label">{{ chat.name }}</span>
        <!-- <span class="tag tag--blue">5</span> could be used for unread indicator -->
      </a>
    }
    
    <a class="nav-item"  (click)="newChatDialog.open()">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-mail-plus-icon lucide-mail-plus"
      >
        <path d="M22 13V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h8" />
        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
        <path d="M19 16v6" />
        <path d="M16 19h6" />
      </svg>
      <span class="nav-item__label">New chat</span>
    </a>
  </nav>

  <!-- Footer -->
  <div class="sidebar__footer">
    <div class="sidebar__avatar">{{ userDisplayName()?.charAt(0)?.toUpperCase() }}</div>
    <div class="sidebar__user-info">
      <div class="sidebar__user-name">{{ userDisplayName() }}</div>
      <!-- <div class="sidebar__user-role">Administrator</div> -->
    </div>
    <button class="sidebar__logout" aria-label="Log out" (click)="logout()">
      <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
    </button>
  </div>
</aside>

<!-- MAIN -->
<main class="main-content">
  @if (id()) {
    <app-chat [chatId]="id() ?? ''" />
  } @else {
    <h2>No chat selected</h2>
  }
</main>

<app-nb-dialog #newChatDialog title="New chat">
    <app-new-chat [creatorId]="userId()" (created)="newChatDialog.close()"></app-new-chat>
</app-nb-dialog>
