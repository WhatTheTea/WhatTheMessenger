<dialog #dialogRef (click)="onBackdropClick($event)">
  <div class="modal-box">
    <header class="modal-header">
      <h3>{{ title() }}</h3>
      <button class="close-btn" (click)="close()">✕</button>
    </header>

    <div class="modal-content">
      <ng-content></ng-content>
    </div>
  </div>
</dialog>
