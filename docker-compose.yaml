name: what-the-messenger

x-connection-string: &db-conn "Host=wtm-db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
x-dotnet-env: &dotnet-env
  ConnectionStrings__PostgresConnection: *db-conn

services:
  wtm-client:
    build: ./client
    ports:
      - ${CLIENT_PORT}:80
    depends_on:
      - wtm-api
    profiles:
      - deploy

  wtm-api:
    build: ./server
    environment:
      <<: *dotnet-env
    ports:
      - ${API_PORT}:8080
    depends_on:
      wtm-migration:
        condition: service_completed_successfully
      wtm-db:
        condition: service_healthy
    profiles:
      - deploy

  wtm-migration:
    build: ./server
    entrypoint: ["/app/efbundle", "--connection", *db-conn]
    environment:
      <<: *dotnet-env
    depends_on:
      wtm-db:
        condition: service_healthy
    profiles:
      - deploy

  wtm-db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - wtm-db-data:/var/lib/postgresql/data/18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5
    profiles:
      - deploy
      - infra

  wtm-pgadmin:
    image: "dpage/pgadmin4:9.12"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
    ports:
      - 5440:80
    volumes:
      - wtm-pgadmin-data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_PASSWORD: Q1234567890y
      PGADMIN_DEFAULT_EMAIL: a@a.com
    depends_on:
      wtm-db:
        condition: service_healthy
    profiles:
      - deploy
      - infra

volumes:
  wtm-db-data:
  wtm-pgadmin-data:
