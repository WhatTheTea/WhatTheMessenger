name: what-the-messenger

x-connection-string: &db-conn "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
x-dotnet-env: &dotnet-env
  ConnectionStrings__PostgresConnection: *db-conn

services:
  gateway:
    image: nginx:alpine
    ports:
      - ${CLIENT_PORT}:80
    depends_on:
      - api
      - client
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    profiles:
     - deploy


  client:
    build: ./client
    depends_on:
      - api
    profiles:
      - deploy

  api:
    build: ./server
    environment:
      <<: *dotnet-env
    depends_on:
      migration:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    profiles:
      - deploy

  # Short lived migration container to create the database and run migrations
  migration:
    build: ./server
    entrypoint: ["/app/efbundle", "--connection", *db-conn]
    environment:
      <<: *dotnet-env
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - deploy

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data/18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5
    profiles:
      - deploy
      - infra

  pgadmin:
    image: "dpage/pgadmin4:9.12"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
    ports:
      - 5440:80
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_PASSWORD: Q1234567890y
      PGADMIN_DEFAULT_EMAIL: a@a.com
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - deploy
      - infra

volumes:
  db-data:
  pgadmin-data:
